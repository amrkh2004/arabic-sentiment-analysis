name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,serving]"

      - name: Run Ruff Linter
        run: |
          ruff check src/ tests/ scripts/

      - name: Run Ruff Format Check
        run: |
          ruff format --check src/ tests/ scripts/

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=arabic_sentiment --cov-report=term-missing --cov-report=xml tests/

      - name: Quality Gate Verification (F1 Macro Baseline Check)
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          metrics_file = Path('metrics.json')
          if not metrics_file.exists():
              print('ERROR: metrics.json not found! Quality Gate FAILED.')
              sys.exit(1)
          with open(metrics_file, 'r', encoding='utf-8') as f:
              metrics = json.load(f)
          f1_macro = metrics.get('macro_f1', 0.0)
          baseline_threshold = 0.85
          print(f'--> Quality Gate Check: Current Macro-F1 = {f1_macro:.4f} (Required Threshold >= {baseline_threshold})')
          if f1_macro < baseline_threshold:
              print(f'QUALITY GATE FAILED: Macro-F1 ({f1_macro:.4f}) is below the required baseline ({baseline_threshold}).')
              sys.exit(1)
          print('QUALITY GATE PASSED: Model satisfies production SLA requirements.')
          "

  docker-build:
    name: Docker Build & Smoke Test
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check if Dockerfile exists
        id: check_docker
        run: |
          if [ -f "Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No Dockerfile found; skipping Docker build and smoke test."
          fi

      - name: Set up Docker Buildx
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: arabic-sentiment-api:${{ github.sha }}
          load: true

      - name: Run Smoke Test on Container
        if: steps.check_docker.outputs.exists == 'true'
        run: |
          docker run -d --name sentiment-api-smoke -p 8000:8000 arabic-sentiment-api:${{ github.sha }}
          echo "Waiting for container startup..."
          sleep 8
          echo "=== Container Status & Logs ==="
          docker ps -a
          docker logs sentiment-api-smoke
          echo "=== Testing /health endpoint ==="
          curl --fail --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8000/health
          echo -e "\n=== Testing /predict endpoint ==="
          curl --fail -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "المنتج ممتاز ورائع والتوصيل سريع"}'
          docker stop sentiment-api-smoke

  build-and-push-ghcr:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if Dockerfile exists
        id: check_docker
        run: |
          if [ -f "Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No Dockerfile found; skipping GHCR push."
          fi

      - name: Set up Docker Buildx
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

